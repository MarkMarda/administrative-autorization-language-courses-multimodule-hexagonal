server:
  port: ${PORT}
spring:
  application:
    name: administrative-autorization-language-courses
  config:
    import: optional:file:.env
  #  main:
  #    allow-bean-definition-overriding: true

  output:
    ansi:
      enabled: ALWAYS

  datasource:
    # Not use default datasource
    generate-unique-name: true
    #Config MYSQL
    #mysql:
      #driver-class-name: com.mysql.cj.jdbc.Driver
      #username: root
      #password: ${MYSQL_ROOT_PASSWORD}
      #url: jdbc:mysql://localhost:3308/${DATABASE_NAME}?createDatabaseIfNotExist=true

    #Config POSTGRESQL
    postgresql:
      driver-class-name: org.postgresql.Driver
      username: ${POSTGRESQL_DB_USER}
      password: ${POSTGRESQL_DB_PASSWORD}
      url: jdbc:postgresql://${POSTGRESQL_DB_HOST}:${POSTGRESQL_DB_PORT}/${POSTGRESQL_DB_NAME}
      hikari:
        # Connection pool settings
        maximum-pool-size: 50 # Adjust based on your application load
        minimum-idle: 10
        idle-timeout: 30000
        max-lifetime: 1800000
        connection-timeout: 30000
        pool-name: HikariCP

  jpa:
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        show_sql: false
        use_sql_comments: true
        jdbc:
          lob:
            non_contextual_creation: true # Prevents issues with LOBs
    hibernate:
      ddl-auto: update # Use 'validate' or 'none' in production environments
      #naming:
        #physical-strategy: org.springframework.boot.orm.jpa.hibernate.SpringPhysicalNamingStrategy
        #implicit-strategy: org.springframework.boot.orm.jpa.hibernate.SpringImplicitNamingStrategy
    #open-in-view: false

logging:
  level:
    org.hibernate.SQL: TRACE
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
    org.springframework.transaction: TRACE
    org.springframework.orm.jpa: TRACE

  pattern:
    console: >
      %clr(%d{yyyy-MM-dd HH:mm:ss.SSS}){bright_green}
      %clr(%5p){INFO=green, WARN=yellow, ERROR=red}
      %clr(${PID:- }){magenta}
      %clr(---){faint}
      %clr([%15.15t]){blue}
      %clr(%-40.40logger{39}){cyan}
      %clr(:){faint}
      %clr(%m){WARN=yellow, ERROR=bright_red}%n%clr(%wEx){bright_red}

    exception-conversion-word: "%clr(%rootException){bright_red}"